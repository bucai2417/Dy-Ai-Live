<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>大肥鱼 · 运营控制台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%9F%3C/text%3E%3C/svg%3E" />
<style>
:root{
  --bg:#050d16; --panel:rgba(12,28,45,.78); --brd:rgba(90,190,255,.16);
  --txt:#e9f5ff; --sub:#8fb3cc; --acc:#39d0ff; --ok:#3ddc84; --warn:#ffbe3d; --bad:#ff5c7a;
  --r:16px;
}
*{box-sizing:border-box}
body{margin:0;background:
  radial-gradient(90% 60% at 50% -10%, #123c5c 0%, #071726 42%, #050d16 100%);
  color:var(--txt);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;min-height:100vh;
  padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
h1{font-size:17px;margin:0 0 14px;display:flex;align-items:center;gap:9px}
h1 span{font-size:11px;color:var(--sub);border:1px solid var(--brd);padding:2px 8px;border-radius:999px;font-weight:400}
.wrap{display:grid;grid-template-columns:1fr 340px;gap:14px;max-width:1180px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--brd);border-radius:var(--r);padding:14px;
  backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.card h2{font-size:13px;margin:0 0 10px;color:var(--sub);font-weight:600;letter-spacing:.4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.stat{background:rgba(255,255,255,.04);border:1px solid var(--brd);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums;color:#fff}
.stat i{font-size:11px;color:var(--sub);font-style:normal}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.off{background:var(--bad);box-shadow:0 0 8px var(--bad)}
textarea{width:100%;min-height:78px;resize:vertical;background:rgba(0,0,0,.35);color:var(--txt);
  border:1px solid var(--brd);border-radius:12px;padding:11px;font-size:14px;font-family:inherit;outline:none}
textarea:focus{border-color:rgba(57,208,255,.5)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button{cursor:pointer;border:1px solid var(--brd);background:rgba(57,208,255,.12);color:var(--acc);
  padding:9px 16px;border-radius:11px;font-size:13px;font-weight:600;font-family:inherit;transition:.15s}
button:hover{background:rgba(57,208,255,.22)}
button:active{transform:scale(.97)}
a.goto{display:inline-block;margin-left:8px;font-size:12px;font-weight:500;text-decoration:none;
  padding:3px 10px;border-radius:999px;border:1px solid var(--brd);color:var(--acc);
  background:rgba(57,208,255,.1);vertical-align:middle;transition:.15s}
a.goto:hover{background:rgba(57,208,255,.22)}
button.primary{background:linear-gradient(90deg,#2bb7ff,#7a6bff);color:#03121e;border:none}
button.warn{background:rgba(255,190,61,.15);color:var(--warn)}
button.bad{background:rgba(255,92,122,.15);color:var(--bad)}
.stream{height:420px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;font-size:13px}
.stream .m{padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.04);border-left:2px solid rgba(57,208,255,.4);
  animation:fade .25s ease}
.stream .m.gift{background:rgba(255,209,102,.1);border-left-color:#ffd166}
.stream .m.enter{opacity:.7;border-left-color:#8f6bff}
.stream .m.ai{background:rgba(57,208,255,.12);border-left-color:var(--acc)}
.stream .u{color:#7fe3ff;font-weight:700;margin-right:6px}
.stream .m.gift .u{color:#ffd166}
.stream .t{color:#dbeaf7;word-break:break-word}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.stream::-webkit-scrollbar{width:6px}
.stream::-webkit-scrollbar-thumb{background:rgba(90,190,255,.25);border-radius:3px}
a.link{color:var(--acc);font-size:12px;text-decoration:none}
a.link:hover{text-decoration:underline}
@media(max-width:820px){
  .wrap{grid-template-columns:1fr}
  .stream{height:300px}
  body{padding:12px}
  .stats{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>大肥鱼运营控制台 <span id="connTag">未连接</span>
      <a class="goto" href="/settings">⚙ 后台配置</a>
      <a class="goto" href="/stage" target="_blank">🖥 直播画面</a>
    </h1>

    <div class="card">
      <h2>实时状态</h2>
      <div class="stats">
        <div class="stat"><b id="sDanmu">0</b><i>弹幕</i></div>
        <div class="stat"><b id="sGift">0</b><i>礼物</i></div>
        <div class="stat"><b id="sReply">0</b><i>AI 回复</i></div>
        <div class="stat"><b id="sOnline">0</b><i>页面在线</i></div>
      </div>
      <div class="row" style="margin-top:12px;font-size:12px;color:var(--sub)">
        <span><i class="dot" id="dBrain"></i>大脑 <b id="tBrain">-</b></span>
        <span><i class="dot" id="dTts"></i>语音 <b id="tTts">-</b></span>
        <span>接入 <b id="tIngest">-</b></span>
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <h2>人工接管 · 让大肥鱼说一句</h2>
      <textarea id="sayText" placeholder="输入想让它念出来的台词，回车或点按钮发送…"></textarea>
      <div class="row">
        <button class="primary" id="btnSay">立即播报</button>
        <button class="warn" id="btnPause">暂停直播</button>
        <button id="btnResume">恢复直播</button>
        <button class="bad" id="btnSkip">跳过当前</button>
        <button id="btnClearSession">清空本场</button>
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <h2>调试 · 注入一条测试弹幕</h2>
      <textarea id="fakeText" style="min-height:52px" placeholder="例如：主播你好呀"></textarea>
      <div class="row">
        <button id="btnFake">注入弹幕</button>
        <a class="link" href="/stage" target="_blank">↗ 打开直播画面</a>
        <a class="link" href="/stage?obs=1" target="_blank">↗ 打开 OBS 纯净版</a>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>实时消息流</h2>
    <div class="stream" id="stream"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let ws = null;

function connect(){
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => { $('connTag').textContent = '已连接'; };
  ws.onclose = () => { $('connTag').textContent = '断开，重连中'; setTimeout(connect, 2500); };
  ws.onmessage = e => { try { handle(JSON.parse(e.data)); } catch {} };
}

function addLine(cls, user, text){
  const box = $('stream');
  const el = document.createElement('div');
  el.className = 'm ' + cls;
  el.innerHTML = `<span class="u">${esc(user)}</span><span class="t">${esc(text)}</span>`;
  box.appendChild(el);
  while (box.children.length > 200) box.removeChild(box.firstChild);
  box.scrollTop = box.scrollHeight;
}

function handle(m){
  switch(m.type){
    case 'hello':
      $('stream').innerHTML = '';
      $('connTag').textContent = m.paused ? '已暂停' : '已连接';
    case 'config_changed':
      if (m.config){
        $('tBrain').textContent = m.config.llm ? '在线' : '离线';
        $('dBrain').className = 'dot ' + (m.config.llm ? 'on' : 'off');
        $('tTts').textContent = m.config.tts;
        $('dTts').className = 'dot ' + (m.config.tts === 'edge' ? 'on' : 'off');
        $('tIngest').textContent = m.config.ingest;
      }
      (m.recent || []).forEach(x => { try { handle(x); } catch {} });
      break;
    case 'event': {
      const ev = m.event; if (!ev) break;
      if (ev.kind === 'chat') addLine('chat', ev.userName, ev.text);
      else if (ev.kind === 'gift') addLine('gift', ev.userName, `🎁 ${ev.giftName} ×${ev.giftCount}`);
      else if (ev.kind === 'enter') addLine('enter', ev.userName, '进入了直播间');
      else if (ev.kind === 'follow') addLine('gift', ev.userName, '关注了主播');
      else if (ev.kind === 'like') addLine('enter', ev.userName, `点赞 ×${ev.giftCount}`);
      break;
    }
    case 'subtitle': addLine('ai', '大肥鱼', m.text); break;
    case 'online': $('sOnline').textContent = m.count; break;
    case 'state': $('connTag').textContent = m.paused ? '已暂停' : '已连接'; break;
    case 'reset': $('stream').innerHTML = ''; break;
    case 'error': $('connTag').textContent = m.error || '操作失败'; break;
    default: break;
  }
}

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function send(obj){
  if (!ws || ws.readyState !== 1) {
    $('connTag').textContent = '连接未就绪，内容已保留，请连接后重试';
    return false;
  }
  ws.send(JSON.stringify(obj));
  return true;
}

$('btnSay').onclick = () => {
  const t = $('sayText').value.trim();
  if (!t) return;
  if (send({ cmd: 'say', text: t })) $('sayText').value = '';
};
$('btnPause').onclick = () => send({ cmd: 'pause' });
$('btnResume').onclick = () => send({ cmd: 'resume' });
$('btnSkip').onclick = () => send({ cmd: 'skip' });
$('btnClearSession').onclick = async () => {
  if (!confirm('清空本场弹幕和歌单，并停止当前播报？今日统计会保留。')) return;
  try {
    const response = await fetch('/api/session/boot', {method: 'POST'});
    const result = await response.json();
    if (!response.ok || !result.ok) throw new Error(result.error || '清空失败');
  } catch (error) {
    $('connTag').textContent = error.message;
  }
};
$('btnFake').onclick = () => {
  const t = $('fakeText').value.trim();
  if (!t) return;
  if (send({ cmd: 'fake_danmu', text: t })) $('fakeText').value = '';
};
$('sayText').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) $('btnSay').click();
});

async function poll(){
  try{
    const r = await fetch('/api/state'); const s = await r.json();
    $('sDanmu').textContent = s.stats.danmu_total ?? 0;
    $('sGift').textContent = s.stats.gift_total ?? 0;
    $('sReply').textContent = s.stats.replies ?? 0;
    $('tIngest').textContent = s.ingest;
  }catch{}
  setTimeout(poll, 2000);
}

connect(); poll();
</script>
</body>
</html>
