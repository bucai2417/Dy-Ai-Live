<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#06121f" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%9F%3C/text%3E%3C/svg%3E" />
<title>大肥鱼 · AI 直播间</title>
<link rel="preconnect" href="/static" />
<link rel="stylesheet" href="/static/assets/whale/whale.css" />
<style>
/* ============================== 设计变量 ============================== */
:root{
  --c-deep:#03080f;
  --c-mid:#06182b;
  --c-glow:#39d0ff;
  --c-glow2:#8f6bff;
  --c-pink:#ff5c9d;
  --c-gold:#ffd166;
  --c-text:#eaf6ff;
  --c-sub:#8fb3cc;
  --glass:rgba(9,24,40,.62);
  --glass-brd:rgba(90,190,255,.20);
  --r-lg:20px;
  --r-md:14px;
  --shadow:0 12px 40px rgba(0,0,0,.55);
  --safe-b:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;}
body{
  background:var(--c-deep);
  color:var(--c-text);
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
  overflow:hidden;
  user-select:none;
}

/* ============================== 舞台容器（16:9 自适应） ============================== */
#stage{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  isolation:isolate;
}
/* 背景：深海渐变 + 光斑 + 水波纹 */
#bg{position:absolute;inset:0;z-index:0;
  background:
    radial-gradient(120% 90% at 50% 0%, #12456b 0%, #0a2740 38%, #05121f 70%, #03080f 100%);
}
#bg::after{
  content:"";position:absolute;inset:-30%;
  background:
    radial-gradient(closest-side, rgba(57,208,255,.16), transparent 70%) 20% 30%/55% 55% no-repeat,
    radial-gradient(closest-side, rgba(143,107,255,.14), transparent 70%) 80% 68%/60% 60% no-repeat,
    radial-gradient(closest-side, rgba(255,92,157,.08), transparent 70%) 55% 90%/45% 45% no-repeat;
  filter:blur(8px);
  animation:drift 22s ease-in-out infinite alternate;
}
@keyframes drift{from{transform:translate3d(-2%,0,0) scale(1)}to{transform:translate3d(3%,-2%,0) scale(1.08)}}

/* 水面光束 */
.beams{position:absolute;inset:-10% -10% auto -10%;height:80%;z-index:0;opacity:.5;
  background:
    conic-gradient(from 200deg at 30% 0%, transparent 0deg, rgba(120,220,255,.10) 12deg, transparent 26deg),
    conic-gradient(from 230deg at 62% 0%, transparent 0deg, rgba(160,200,255,.09) 10deg, transparent 24deg),
    conic-gradient(from 260deg at 85% 0%, transparent 0deg, rgba(120,220,255,.07) 8deg, transparent 22deg);
  filter:blur(2px);
  animation:beams 9s ease-in-out infinite alternate;
}
@keyframes beams{from{opacity:.35;transform:translateY(0)}to{opacity:.6;transform:translateY(2%)}}

/* 漂浮气泡 */
.bubbles{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.bubbles i{
  position:absolute;bottom:-12vh;border-radius:50%;
  background:radial-gradient(circle at 32% 30%, rgba(255,255,255,.9), rgba(120,220,255,.25) 45%, rgba(120,220,255,0) 70%);
  border:1px solid rgba(160,230,255,.35);
  animation:rise linear infinite;
  opacity:.65;
}
@keyframes rise{
  0%{transform:translateY(0) translateX(0) scale(.7);opacity:0}
  10%{opacity:.7}
  90%{opacity:.5}
  100%{transform:translateY(-118vh) translateX(var(--dx,20px)) scale(1.15);opacity:0}
}

/* ============================== 角色 ============================== */
#avatarWrap{
  position:absolute;inset:0;z-index:2;
  display:flex;align-items:flex-end;justify-content:center;
  pointer-events:none;
}
#canvasHost{width:100%;height:100%;}
#canvasHost canvas{display:block;}
/* 脚下光圈 */
#glowRing{
  position:absolute;left:50%;bottom:6%;transform:translateX(-50%);
  width:min(46vh,42vw);height:7vh;border-radius:50%;
  background:radial-gradient(closest-side, rgba(57,208,255,.45), rgba(57,208,255,0) 72%);
  filter:blur(6px);z-index:1;pointer-events:none;
  animation:pulse 3.6s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.55;transform:translateX(-50%) scale(1)}50%{opacity:.95;transform:translateX(-50%) scale(1.08)}}

/* 角色加载/失败占位：一个可爱的鱼形 SVG，保证没模型时也不难看 */
#fishFallback{
  position:absolute;left:50%;bottom:12vh;transform:translateX(-50%);
  width:min(52vw,420px);z-index:2;display:none;pointer-events:none;
  filter:drop-shadow(0 18px 40px rgba(0,0,0,.5));
}
#fishFallback.show{display:block;}
#fishFallback svg{width:100%;height:auto;}
#fishFallback .fish-body{animation:swim 3.4s ease-in-out infinite;}
@keyframes swim{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-14px) rotate(1.5deg)}}
#fishFallback .mouth{transform-origin:center;animation:mouthIdle 2.6s ease-in-out infinite;}
@keyframes mouthIdle{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
body.speaking #fishFallback .mouth{animation:mouthTalk .28s ease-in-out infinite;}
@keyframes mouthTalk{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1.25)}}

/* ============================== 顶部信息条 ============================== */
.topbar{
  position:absolute;top:0;left:0;right:0;z-index:6;
  display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;
  background:linear-gradient(to bottom, rgba(3,8,15,.85), rgba(3,8,15,0));
}
.brand{display:flex;align-items:center;gap:9px;min-width:0;}
.brand .dot{
  width:9px;height:9px;border-radius:50%;background:#ff4d6d;flex:none;
  box-shadow:0 0 0 0 rgba(255,77,109,.7);animation:livePulse 1.8s infinite;
}
@keyframes livePulse{
  0%{box-shadow:0 0 0 0 rgba(255,77,109,.6)}
  70%{box-shadow:0 0 0 9px rgba(255,77,109,0)}
  100%{box-shadow:0 0 0 0 rgba(255,77,109,0)}
}
.brand .name{font-weight:800;font-size:15px;letter-spacing:.5px;white-space:nowrap;
  background:linear-gradient(90deg,#fff,#8fe6ff 70%);
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.brand .tag{font-size:11px;color:var(--c-sub);border:1px solid var(--glass-brd);
  padding:1px 7px;border-radius:999px;white-space:nowrap;}
.topbar .spacer{flex:1;}
.pill{
  display:flex;align-items:center;gap:6px;font-size:12px;color:var(--c-sub);
  background:var(--glass);border:1px solid var(--glass-brd);
  padding:5px 11px;border-radius:999px;backdrop-filter:blur(10px);
  white-space:nowrap;
}
.pill b{color:#fff;font-weight:700;font-variant-numeric:tabular-nums;}
.pill .mini-dot{width:6px;height:6px;border-radius:50%;background:#31d07a;}

/* ============================== 弹幕区 ============================== */
.danmu{
  position:absolute;left:14px;bottom:140px;z-index:5;
  width:min(34vw,360px);
  display:flex;flex-direction:column;justify-content:flex-end;
  gap:6px;
  max-height:46vh;overflow:hidden;
  mask-image:linear-gradient(to bottom, transparent 0, #000 14%, #000 88%, transparent 100%);
}
.danmu .item{
  display:flex;gap:8px;align-items:flex-start;
  background:linear-gradient(90deg, rgba(8,26,44,.92), rgba(8,26,44,.55));
  border-left:2px solid rgba(57,208,255,.55);
  padding:7px 11px;border-radius:0 12px 12px 0;
  font-size:13.5px;line-height:1.45;
  animation:slideIn .34s cubic-bezier(.2,.9,.3,1.2);
  backdrop-filter:blur(6px);
  flex:none;
}
@keyframes slideIn{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
/* 被顶掉的旧弹幕淡出收缩，而不是"啪"一下消失——
   直接 removeChild 会让整列猛地往上一跳，看起来像在循环重播 */
.danmu .item.out{
  animation:slideOut .22s ease forwards;
  transform-origin:top center;
}
@keyframes slideOut{
  from{opacity:1;transform:none;max-height:80px}
  to{opacity:0;transform:translateY(-6px) scaleY(.6);max-height:0;
     padding-top:0;padding-bottom:0;margin-top:-6px}
}
.danmu .item.gift{border-left-color:var(--c-gold);
  background:linear-gradient(90deg, rgba(72,52,10,.92), rgba(72,52,10,.4));}
.danmu .item.enter{opacity:.72;border-left-color:rgba(143,107,255,.6);}
.danmu .u{color:#7fe3ff;font-weight:700;flex:none;max-width:38%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}
.danmu .item.gift .u{color:var(--c-gold);}
.danmu .t{color:#e8f4ff;word-break:break-word;}
.danmu .item.answered{opacity:.45;}
.danmu .tagx{font-size:10px;padding:0 5px;border-radius:5px;background:rgba(57,208,255,.16);
  color:#7fe3ff;flex:none;align-self:center;}
/* 空状态：没有真实弹幕时明确告知，不显示任何伪造内容 */
.danmu .empty-hint{
  font-size:12px;color:#6b8ba3;padding:7px 11px;border-left:2px solid rgba(107,139,163,.4);
  background:rgba(0,0,0,.22);border-radius:8px;line-height:1.5;
}

/* ============================== 字幕 ============================== */
.subtitle{
  position:absolute;left:50%;bottom:78px;transform:translateX(-50%);
  z-index:7;width:min(88vw,860px);text-align:center;
  opacity:0;transition:opacity .22s ease;
  pointer-events:none;
}
.subtitle.on{opacity:1;}
/* 后台关掉字幕后彻底不占视觉，但保留 DOM 避免逻辑报错 */
.subtitle[data-hide="1"]{display:none;}
.subtitle .box{
  display:inline-block;
  padding:9px 20px;border-radius:14px;
  background:rgba(4,14,24,.72);
  border:1px solid rgba(90,190,255,.22);
  backdrop-filter:blur(12px);
  box-shadow:0 6px 26px rgba(0,0,0,.45);
  font-size:clamp(15px,2.1vh,21px);
  line-height:1.5;
  font-weight:600;
  text-shadow:0 2px 10px rgba(0,0,0,.6);
}
.subtitle .cursor{
  display:inline-block;width:2px;height:1em;background:var(--c-glow);
  vertical-align:-2px;margin-left:2px;animation:blink .8s step-end infinite;
}
@keyframes blink{50%{opacity:0}}

/* ============================== 状态角标 ============================== */
.statebar{
  position:absolute;right:14px;top:52px;z-index:6;
  display:flex;flex-direction:column;gap:6px;align-items:flex-end;
}
.badge{
  font-size:11px;padding:4px 10px;border-radius:999px;
  background:var(--glass);border:1px solid var(--glass-brd);color:var(--c-sub);
  backdrop-filter:blur(8px);display:flex;align-items:center;gap:5px;
}
.badge.hot{color:#0a1a12;background:linear-gradient(90deg,#5ef2a0,#39d0ff);border-color:transparent;font-weight:700;}

/* 表情气泡 */
.bubble{
  position:absolute;z-index:7;pointer-events:none;
  background:rgba(255,255,255,.95);color:#06202f;font-weight:800;
  padding:6px 12px;border-radius:14px;font-size:13px;
  opacity:0;transform:translateY(6px) scale(.9);
  transition:all .22s cubic-bezier(.2,.9,.3,1.3);
}
.bubble.on{opacity:1;transform:none;}

/* ============================== 底部条 ============================== */
.bottom{
  position:absolute;left:0;right:0;bottom:0;z-index:6;
  display:flex;align-items:center;gap:10px;
  padding:10px 14px calc(10px + var(--safe-b));
  background:linear-gradient(to top, rgba(3,8,15,.88), rgba(3,8,15,0));
}
.hint{
  flex:1;min-width:0;display:flex;align-items:center;gap:8px;
  background:var(--glass);border:1px solid var(--glass-brd);
  border-radius:999px;padding:9px 15px;font-size:12.5px;color:var(--c-sub);
  backdrop-filter:blur(10px);
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.hint .ico{color:var(--c-glow);flex:none;}
.btn{
  flex:none;width:40px;height:40px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;
  background:var(--glass);border:1px solid var(--glass-brd);
  color:var(--c-text);backdrop-filter:blur(10px);
  transition:transform .15s, background .2s;
}
.btn:hover{background:rgba(30,80,120,.7);}
.btn:active{transform:scale(.92);}
.btn svg{width:19px;height:19px;}

/* 连线状态 */
#conn{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  z-index:20;padding:12px 22px;border-radius:14px;
  background:rgba(3,10,18,.9);border:1px solid var(--glass-brd);
  font-size:13px;color:var(--c-sub);display:none;
}
#conn.show{display:block;}

/* 礼物飘屏 */
.floatLayer{position:absolute;inset:0;z-index:8;pointer-events:none;overflow:hidden;}
.floatGift{
  position:absolute;left:0;top:0;font-size:13px;font-weight:800;white-space:nowrap;
  color:#1b1200;background:linear-gradient(90deg,#ffe07a,#ffb347);
  padding:6px 14px;border-radius:999px;box-shadow:0 6px 22px rgba(255,180,70,.45);
  animation:floatAcross 4.2s linear forwards;
}
@keyframes floatAcross{
  0%{opacity:0;transform:translate(-10vw,0) scale(.8)}
  12%{opacity:1;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(105vw,-16vh) scale(1.02)}
}

/* ============================== 今日数据气泡 ============================== */
.datapods{
  position:absolute;left:14px;top:52px;z-index:6;
  display:flex;flex-direction:column;gap:6px;
}
.pod{
  display:flex;align-items:center;gap:7px;
  padding:5px 11px 5px 8px;border-radius:11px;
  background:var(--glass);border:1px solid var(--glass-brd);
  backdrop-filter:blur(8px);box-shadow:0 4px 16px rgba(0,0,0,.28);
  transition:transform .18s ease,border-color .18s ease;
}
.pod-ico{
  width:19px;height:19px;flex:none;border-radius:6px;display:grid;place-items:center;
  font-size:11px;font-weight:800;color:#04121e;
  background:linear-gradient(160deg,#7fe9ff,#39a8ff);
}
.pod:nth-child(2) .pod-ico{background:linear-gradient(160deg,#ffd166,#ff9f43);}
.pod:nth-child(3) .pod-ico{background:linear-gradient(160deg,#c4b5ff,#8f6bff);color:#fff;}
.pod-body{display:flex;flex-direction:column;line-height:1.15;}
.pod-body b{font-size:12.5px;font-variant-numeric:tabular-nums;color:#eaf6ff;}
.pod-body i{font-style:normal;font-size:9.5px;color:var(--c-sub);letter-spacing:.02em;}
.pod.bump{transform:scale(1.06);border-color:rgba(57,208,255,.55);}

/* ============================== 礼物排行榜 ============================== */
.rankboard{
  position:absolute;right:14px;bottom:96px;z-index:6;
  width:186px;padding:9px 10px 10px;border-radius:var(--r-md);
  background:var(--glass);border:1px solid var(--glass-brd);
  backdrop-filter:blur(10px);box-shadow:var(--shadow);
}
.rank-title{
  display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
  color:var(--c-gold);margin-bottom:7px;letter-spacing:.04em;
}
.rank-title .crown{font-size:12px;}
.rank-empty{font-size:11px;color:#5f8098;padding:4px 2px;}
.rank-list{display:flex;flex-direction:column;gap:5px;}

.rank-row{
  position:relative;display:flex;align-items:center;gap:7px;
  padding:5px 7px;border-radius:9px;overflow:hidden;
  background:rgba(255,255,255,.03);border:1px solid transparent;
  transition:transform .2s ease;
}
.rank-row .av{
  width:22px;height:22px;flex:none;border-radius:50%;object-fit:cover;
  background:rgba(57,208,255,.16);
  display:grid;place-items:center;font-size:10px;font-weight:800;color:#9fe4ff;
}
.rank-row .who{
  flex:1;min-width:0;font-size:11.5px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;
}
.rank-row .val{font-size:10.5px;color:var(--c-gold);font-variant-numeric:tabular-nums;flex:none;}
.rank-row .no{
  width:15px;flex:none;font-size:10.5px;font-weight:800;color:#6b8ba3;text-align:center;
}

/* 前 3 名专属特效 */
.rank-row.r1{
  background:linear-gradient(90deg,rgba(255,209,102,.22),rgba(255,209,102,.04));
  border-color:rgba(255,209,102,.55);
  box-shadow:0 0 14px rgba(255,209,102,.28),inset 0 0 12px rgba(255,209,102,.08);
}
.rank-row.r1 .no{color:#ffd166;}
.rank-row.r1::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.42) 48%,transparent 62%);
  transform:translateX(-120%);animation:rankShine 3.2s ease-in-out infinite;
}
@keyframes rankShine{
  0%,70%{transform:translateX(-120%)}
  100%{transform:translateX(120%)}
}

.rank-row.r2{
  background:linear-gradient(90deg,rgba(200,222,240,.18),rgba(200,222,240,.03));
  border-color:rgba(200,222,240,.42);
}
.rank-row.r2 .no{color:#c8def0;}

.rank-row.r3{
  background:linear-gradient(90deg,rgba(255,166,110,.16),rgba(255,166,110,.03));
  border-color:rgba(255,166,110,.40);
}
.rank-row.r3 .no{color:#ffa66e;}

/* 新进榜/名次变化时闪一下 */
.rank-row.flash{animation:rankPop .5s ease;}
@keyframes rankPop{
  0%{transform:scale(1)}
  40%{transform:scale(1.05)}
  100%{transform:scale(1)}
}

/* ============================== 音乐播放器 ============================== */
.player{
  position:absolute;left:50%;transform:translateX(-50%);bottom:136px;z-index:7;
  display:flex;align-items:center;gap:10px;
  width:min(430px,82vw);padding:8px 12px 8px 8px;border-radius:14px;
  background:rgba(9,24,40,.74);border:1px solid var(--glass-brd);
  backdrop-filter:blur(12px);box-shadow:var(--shadow);
  transition:opacity .25s ease;
}
.player.dim{opacity:.45;}

.pl-disc{
  width:34px;height:34px;flex:none;border-radius:50%;
  background:conic-gradient(from 0deg,#1b4a6b,#39d0ff,#8f6bff,#1b4a6b);
  display:grid;place-items:center;position:relative;
  box-shadow:0 0 12px rgba(57,208,255,.35);
}
.pl-disc::after{
  content:"";position:absolute;width:9px;height:9px;border-radius:50%;
  background:var(--c-deep);
}
.pl-note{
  position:relative;z-index:1;font-size:13px;color:#eaf6ff;
  opacity:0;transition:opacity .2s;
}
/* 播放时唱片转，暂停就停——比任何文字都直观 */
.player.on .pl-disc{animation:spin 4s linear infinite;}
.player.on .pl-note{opacity:1;}
@keyframes spin{to{transform:rotate(360deg)}}

.pl-info{flex:1;min-width:0;}
.pl-row1{display:flex;align-items:baseline;gap:6px;}
.pl-title{
  font-size:12.5px;font-weight:600;color:#eaf6ff;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pl-src{
  flex:none;font-size:9px;padding:1px 5px;border-radius:4px;
  background:rgba(57,208,255,.16);color:#7fe9ff;
}
.pl-row2{
  display:flex;align-items:baseline;gap:8px;margin-top:1px;
}
.pl-by{
  flex:1;min-width:0;font-size:10.5px;color:var(--c-sub);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pl-q{flex:none;font-size:10px;color:var(--c-gold);}

/* 队列：铺开显示歌名，观众能看到自己点的排第几 */
.pl-queue{margin-top:3px;}
.pl-qi{
  display:flex;align-items:baseline;gap:5px;
  font-size:10px;color:#9fb8cc;line-height:1.45;
  overflow:hidden;white-space:nowrap;
}
.pl-qn{
  flex:none;width:12px;height:12px;border-radius:3px;
  display:grid;place-items:center;font-size:8px;
  background:rgba(57,208,255,.14);color:#7fe9ff;
}
.pl-qt{
  flex:1;min-width:0;color:#c8dced;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pl-qb{
  flex:none;font-size:9px;color:var(--c-sub);max-width:88px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pl-qmore{font-size:9px;color:var(--c-sub);padding-left:17px;}

.pl-bar{
  height:2px;margin-top:4px;border-radius:2px;overflow:hidden;
  background:rgba(255,255,255,.12);
}
.pl-bar i{
  display:block;height:100%;width:0;
  background:linear-gradient(90deg,#39d0ff,#8f6bff);
  transition:width .3s linear;
}

.pl-ops{display:flex;align-items:center;gap:5px;flex:none;}
.pl-btn{
  width:26px;height:26px;border-radius:8px;cursor:pointer;
  background:rgba(255,255,255,.07);border:1px solid var(--glass-brd);
  color:#cfe8f8;font-size:12px;line-height:1;display:grid;place-items:center;
  transition:background .15s,transform .1s;
}
.pl-btn:hover{background:rgba(57,208,255,.18);}
.pl-btn:active{transform:scale(.92);}
.pl-btn.main{
  width:30px;height:30px;font-size:13px;color:#04121e;font-weight:700;
  background:linear-gradient(160deg,#7fe9ff,#39a8ff);border:none;
}

@media (max-aspect-ratio: 1/1){
  /* 竖屏字幕在 bottom:112px，播放器要抬到它上面 */
  .player{width:min(340px,92vw);bottom:172px;padding:6px 10px 6px 6px;gap:8px;}
  .pl-disc{width:28px;height:28px;}
  .pl-title{font-size:11.5px;}
  .pl-by{font-size:9.5px;}
  .pl-btn{width:23px;height:23px;font-size:11px;}
  .pl-btn.main{width:26px;height:26px;}
}
@media (max-height: 520px){
  /* 矮屏字幕在 bottom:52px */
  .player{bottom:96px;width:min(360px,60vw);}
  .pl-bar{display:none;}
}
body.obs .player{bottom:84px;}

/* ============================== 送礼观众浮动气泡 ============================== */
.ballpit{
  position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden;
}
.ball{
  position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;
  padding:4px 11px 4px 4px;border-radius:999px;white-space:nowrap;
  background:rgba(9,24,40,.72);border:1px solid rgba(90,190,255,.28);
  backdrop-filter:blur(6px);box-shadow:0 6px 20px rgba(0,0,0,.4);
  will-change:transform;
}
.ball .bav{
  width:22px;height:22px;flex:none;border-radius:50%;object-fit:cover;
  background:linear-gradient(160deg,#4fc4f0,#1b6fa8);
  display:grid;place-items:center;font-size:10px;font-weight:800;color:#04121e;
}
.ball .bnm{font-size:11.5px;color:#eaf6ff;font-weight:600;}
/* 前三名气泡带光晕，和排行榜呼应 */
.ball.g1{border-color:rgba(255,209,102,.75);box-shadow:0 0 16px rgba(255,209,102,.45);}
.ball.g2{border-color:rgba(200,222,240,.65);box-shadow:0 0 12px rgba(200,222,240,.32);}
.ball.g3{border-color:rgba(255,166,110,.62);box-shadow:0 0 12px rgba(255,166,110,.30);}

/* ============================== 互动特效层 ============================== */.fxLayer{position:absolute;inset:0;z-index:9;pointer-events:none;overflow:hidden;}

.fx-confetti{
  position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;
  animation-name:fxFall;animation-timing-function:cubic-bezier(.3,.6,.5,1);
  animation-fill-mode:forwards;
}
@keyframes fxFall{
  0%{opacity:0;transform:translate(0,-20px) rotate(0deg)}
  10%{opacity:1}
  100%{opacity:0;transform:translate(var(--dx),105vh) rotate(var(--rot))}
}

.fx-heart{
  position:absolute;bottom:22%;line-height:1;
  animation-name:fxRise;animation-timing-function:ease-out;animation-fill-mode:forwards;
  filter:drop-shadow(0 3px 8px rgba(255,110,160,.55));
}
@keyframes fxRise{
  0%{opacity:0;transform:translate(0,0) scale(.5)}
  18%{opacity:1;transform:translate(0,-16px) scale(1.12)}
  100%{opacity:0;transform:translate(var(--dx),-60vh) scale(.85)}
}

.fx-sparkle{
  position:absolute;width:10px;height:10px;
  background:radial-gradient(circle,#fff 0%,#9fe4ff 45%,rgba(57,208,255,0) 72%);
  border-radius:50%;
  animation:fxTwinkle 1.1s ease-out forwards;
}
@keyframes fxTwinkle{
  0%{opacity:0;transform:scale(.2)}
  35%{opacity:1;transform:scale(1.5)}
  100%{opacity:0;transform:scale(.3)}
}

.fx-flash{
  position:absolute;inset:0;z-index:20;pointer-events:none;
  background:radial-gradient(circle at 50% 55%,rgba(255,255,255,.75),rgba(255,255,255,0) 68%);
  opacity:0;transition:opacity .12s ease;
}
.fx-flash.on{opacity:1;}

/* ============================== 手机竖屏适配 ============================== */
@media (max-aspect-ratio: 1/1){
  .danmu{
    left:10px;right:10px;width:auto;bottom:200px;
    max-height:24vh;
  }
  .danmu .item{font-size:12.5px;padding:6px 9px;}
  .subtitle{bottom:112px;width:94vw;}
  .subtitle .box{padding:7px 14px;border-radius:12px;font-size:14px;}
  .statebar{top:48px;right:10px;}
  .brand .tag{display:none;}
  /* 数据气泡缩小，避免挤占画面 */
  .datapods{left:10px;top:48px;gap:4px;}
  .pod{padding:3px 8px 3px 5px;gap:5px;border-radius:9px;}
  .pod-ico{width:16px;height:16px;font-size:9px;border-radius:5px;}
  .pod-body b{font-size:11px;}
  .pod-body i{font-size:8.5px;}
  /* 排行榜挪到右上，宽度收紧；top 要避开状态徽章（徽章在 top:48 + 两枚约 46 高） */
  .rankboard{width:148px;right:10px;bottom:auto;top:104px;padding:7px 8px 8px;}
  .rank-title{font-size:10.5px;margin-bottom:5px;}
  .rank-row{padding:4px 5px;gap:5px;}
  .rank-row .av{width:18px;height:18px;font-size:9px;}
  .rank-row .who{font-size:10.5px;}
  .rank-row .val{font-size:9.5px;}
  .rank-row .no{width:12px;font-size:9.5px;}
  .ball .bav{width:18px;height:18px;font-size:9px;}
  .ball .bnm{font-size:10.5px;}
  .bottom{gap:8px;padding:8px 10px calc(8px + var(--safe-b));}
  .btn{width:42px;height:42px;}
  #glowRing{bottom:4%;}
}
/* 超宽屏：让角色不被拉得太大 */
@media (min-aspect-ratio: 21/9){
  #canvasHost{transform:scale(.94);}
}
/* 矮屏（手机横屏 / 小窗口）：压缩弹幕区，避免压住字幕 */
@media (max-height: 520px){
  .danmu{
    left:10px;right:auto;width:min(42vw,300px);
    bottom:118px;max-height:40vh;
  }
  .danmu .item{font-size:12px;padding:5px 8px;}
  .subtitle{bottom:52px;width:min(86vw,720px);}
  .subtitle .box{padding:5px 12px;font-size:13.5px;}
  .statebar{top:44px;}
  .topbar{padding-top:6px;padding-bottom:6px;}
  /* 矮屏空间紧张：数据气泡横排到左上角一行，排行榜隐藏（OBS 用主播自己看后台） */
  .datapods{left:8px;top:42px;flex-direction:row;gap:4px;}
  .pod{padding:2px 7px 2px 4px;}
  .pod-body i{display:none;}
  .rankboard{display:none;}
  .bottom{padding:6px 10px calc(6px + var(--safe-b));}
  .btn{width:36px;height:36px;}
}
/* 降低动效，弱设备更稳 */
@media (prefers-reduced-motion: reduce){
  #bg::after,.beams,.bubbles i{animation:none;}
}
/* 隐藏 OBS 里不需要的控件 */
body.obs .bottom, body.obs .statebar{display:none;}
body.obs .danmu{bottom:74px;}
body.obs .subtitle{bottom:26px;}
</style>
</head>
<body>

<div id="stage">
  <div id="bg"></div>
  <div class="beams"></div>
  <div class="bubbles" id="bubbles"></div>

  <!-- 顶部 -->
  <div class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <span class="name" id="brandName">大肥鱼</span>
      <span class="tag">AI 虚拟主播</span>
    </div>
    <div class="spacer"></div>
    <div class="pill"><span class="mini-dot"></span>在线 <b id="onlineNum">0</b></div>
    <div class="pill" title="本场累计观看人次">👁 <b id="totalWatchNum">0</b></div>
    <div class="pill">💬 <b id="danmuNum">0</b></div>
  </div>

  <!-- 状态 -->
  <div class="statebar">
    <div class="badge" id="badgeTts">语音 ●</div>
    <div class="badge" id="badgeBrain">大脑 ●</div>
  </div>

  <!-- 今日数据气泡：token 消耗 / 花费 / 对话次数 -->
  <div class="datapods" id="datapods">
    <div class="pod" title="今日模型消耗 token">
      <span class="pod-ico">◈</span>
      <span class="pod-body"><b id="podTokensVal">0</b><i>token</i></span>
    </div>
    <div class="pod" title="今日估算花费">
      <span class="pod-ico">¥</span>
      <span class="pod-body"><b id="podCostVal">0.00</b><i>今日花费</i></span>
    </div>
    <div class="pod" title="今日对话次数">
      <span class="pod-ico">✦</span>
      <span class="pod-body"><b id="podChatVal">0</b><i>次对话</i></span>
    </div>
  </div>

  <!-- 礼物排行榜：前 3 名有专属特效 -->
  <div class="rankboard" id="rankboard">
    <div class="rank-title"><span class="crown">👑</span><span>土豪榜</span></div>
    <div class="rank-list" id="rankList">
      <div class="rank-empty">还没有人送礼</div>
    </div>
  </div>

  <!-- 送礼观众头像气泡：自由飘动、碰边回弹 -->
  <div class="ballpit" id="ballpit"></div>

  <!-- 音乐播放器 -->
  <div class="player" id="player">
    <div class="pl-disc" id="plDisc"><span class="pl-note">♪</span></div>
    <div class="pl-info">
      <div class="pl-row1">
        <span class="pl-title" id="plTitle">还没有放歌</span>
        <span class="pl-src" id="plSrc"></span>
      </div>
      <div class="pl-row2">
        <span class="pl-by" id="plBy">点歌请说「点歌 歌名」</span>
      </div>
      <div class="pl-bar"><i id="plBar"></i></div>
      <div class="pl-queue" id="plQueue"></div>
    </div>
    <div class="pl-ops">
      <button class="pl-btn" id="plNext" title="切歌">⏭</button>
      <button class="pl-btn main" id="plToggle" title="播放/暂停">▶</button>
    </div>
  </div>

  <!-- 角色 -->
  <div id="avatarWrap">
    <div id="glowRing"></div>
    <div id="canvasHost"></div>
    <div id="fishFallback">
      <svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#7fe9ff"/><stop offset="55%" stop-color="#31a8e0"/>
            <stop offset="100%" stop-color="#1b6fa8"/>
          </linearGradient>
          <radialGradient id="belly" cx="45%" cy="35%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity=".95"/>
            <stop offset="100%" stop-color="#cfeeff" stop-opacity=".15"/>
          </radialGradient>
        </defs>
        <g class="fish-body">
          <path d="M300 128 L372 74 L362 128 L372 182 Z" fill="#1b6fa8" opacity=".95"/>
          <ellipse cx="190" cy="130" rx="128" ry="88" fill="url(#fg)"/>
          <ellipse cx="170" cy="152" rx="82" ry="52" fill="url(#belly)" opacity=".65"/>
          <path d="M150 52 Q196 8 244 50 Q200 66 150 52 Z" fill="#4fc4f0" opacity=".9"/>
          <circle cx="112" cy="104" r="21" fill="#04202f"/>
          <circle cx="106" cy="98" r="7" fill="#fff" opacity=".95"/>
          <circle cx="120" cy="112" r="3" fill="#8fe6ff" opacity=".8"/>
          <ellipse class="mouth" cx="70" cy="146" rx="16" ry="12" fill="#7c2d4a" opacity=".85"/>
          <circle cx="140" cy="146" r="14" fill="#ff9ec4" opacity=".35"/>
          <circle cx="96" cy="60" r="7" fill="#bff2ff" opacity=".6"/>
        </g>
      </svg>
    </div>
  </div>

  <!-- 弹幕 -->
  <div class="danmu" id="danmuList"></div>

  <!-- 字幕 -->
  <div class="subtitle" id="subtitle"><span class="box"><span id="subText"></span><span class="cursor"></span></span></div>

  <!-- 礼物飘屏 -->
  <div class="floatLayer" id="floatLayer"></div>

  <!-- 互动特效层：彩带 / 爱心 / 闪光 -->
  <div class="fxLayer" id="fxLayer"></div>

  <!-- 底部 -->
  <div class="bottom">
    <div class="hint"><span class="ico">✦</span><span id="hintText">AI 正在看弹幕，随时准备接话…</span></div>
    <button class="btn" id="btnSound" title="声音开关">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M11 5 6 9H3v6h3l5 4V5z"/><path id="wavePath" d="M15.5 8.5a5 5 0 0 1 0 7"/>
      </svg>
    </button>
    <button class="btn" id="btnFull" title="全屏">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 9V4h5M20 15v5h-5M15 4h5v5M9 20H4v-5"/>
      </svg>
    </button>
  </div>

  <div id="conn">正在连接直播服务…</div>
</div>

<!-- Live2D 依赖（本地，离线可用） -->
<script src="/static/vendor/live2dcubismcore.min.js"></script>
<script src="/static/vendor/pixi.min.js"></script>
<script src="/static/vendor/cubism4.min.js"></script>

<script src="/static/assets/whale/art.js"></script>

</body>
