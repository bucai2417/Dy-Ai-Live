name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    name: Test and build Windows x64
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
    outputs:
      artifact_name: ${{ steps.build.outputs.artifact_name }}
    steps:
      - name: Checkout source (v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python 3.10 (v7.1.0)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.10"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            requirements-build.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements-build.txt
      - name: Run regression tests
        run: python -m pytest tests -q --junitxml=build/test-results.xml
      - name: Build and launch packaged application
        if: github.event_name != 'pull_request'
        id: build
        run: |
          $buildArguments = @('tools/build_windows.py')
          if ($env:RELEASE_TAG) { $buildArguments += @('--tag', $env:RELEASE_TAG) }
          python @buildArguments
      - name: Upload portable ZIP and SHA256 (v7.0.2)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: |
            dist/windows/*.zip
            dist/windows/*.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload test reports (v7.0.2)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/test-results.xml
            build/windows-check/*.json
            build/windows-check/*.png
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Attach versioned Windows package
    needs: windows
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified package (v8.0.2)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.windows.outputs.artifact_name }}
          path: release-files
      - name: Publish assets to the matching tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Dy-Ai-Live $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-files/*.zip release-files/*.sha256
